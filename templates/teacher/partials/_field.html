{# {% include "teacher/partials/_field.html" with field=form.title %}  : renders label + your normal widget + help + errors #}
<div class="sp-field{% if field.errors %} sp-field--err{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="sp-help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="sp-error" role="alert">{{ e }}</p>{% endfor %}
</div>
