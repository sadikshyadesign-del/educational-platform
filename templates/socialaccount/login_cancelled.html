{% extends "base.html" %}

{% block title %}Sign In Cancelled — {{ site_settings.site_name }}{% endblock title %}

{% block content %}
<div class="auth-page min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </div>
    <h1 class="auth-heading text-3xl tracking-tight">
      Sign In Cancelled
    </h1>
    <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">
      You cancelled the Google sign-in process before it was completed. No account was logged in.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="auth-card py-8 px-6 text-center sm:px-10">
      <a
        href="{% url 'account_login' %}"
        class="auth-primary w-full inline-flex min-h-[44px] justify-center py-2.5 px-4 text-sm font-semibold shadow-sm transition-all"
      >
        Return to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock content %}
