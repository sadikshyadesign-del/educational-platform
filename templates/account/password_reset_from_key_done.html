{% extends "base.html" %}

{% block title %}Password Changed — {{ site_settings.site_name }}{% endblock title %}

{% block content %}
<div class="auth-page min-h-[75vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="auth-card py-8 px-6 sm:px-10 text-center">

      <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mx-auto mb-4 ring-1 ring-emerald-500/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h1 class="auth-heading text-2xl tracking-tight">
        Password Changed
      </h1>

      <p class="mt-3 text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
        Your password has been successfully updated. You can now log in using your new credentials.
      </p>

      <div class="mt-6">
        <a
          href="{% url 'account_login' %}"
          class="auth-primary w-full inline-flex min-h-[44px] items-center justify-center px-4 py-2.5 text-sm font-semibold shadow-sm transition"
        >
          Log in with new password
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock content %}
